[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wii-music-editor"
path = "src/main.rs"

[dependencies]
wm_core = { path = "../core" }
iced = { version = "0.13", features = ["multi-window"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
unic-langid = "0.9"
rfd = "0.15"
log = { workspace = true }
discord-rich-presence = "0.2"
self_update = { version = "0.43", features = ["archive-zip", "compression-zip-deflate", "rustls", "archive-tar", "compression-flate2"] }
ini = "1.3"
tempfile = "3"
thiserror = { workspace = true }

[lints]
workspace = true
