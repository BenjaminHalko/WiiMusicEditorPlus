[package]
name = "editor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "wii-music-editor"
path = "src/main.rs"

[dependencies]
wm_core = { path = "../core" }
slint = { version = "1", features = ["gettext"] }
rfd = "0.15"
log = { workspace = true }
discord-rich-presence = "0.2"
self_update = { version = "0.43", features = ["archive-zip", "compression-zip-deflate", "rustls", "archive-tar", "compression-flate2"] }
ini = "1.3"
tempfile = "3"
thiserror = { workspace = true }

[build-dependencies]
slint-build = "1"

[lints]
workspace = true
